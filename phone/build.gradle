plugins {
    id "com.android.application"
}

android {
    namespace "org.oxycblt.auxio.companion.phone"
    compileSdk target_sdk

    defaultConfig {
        // Data Layer only connects a phone app and a watch app that share the same
        // applicationId (and signing key), so this MUST match :wear.
        applicationId "org.oxycblt.auxio.companion"
        minSdk min_sdk_phone
        targetSdk target_sdk
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation project(":protocol")

    implementation "androidx.core:core-ktx:1.15.0"
    // MediaBrowserCompat / MediaControllerCompat: the same API Android Auto uses to talk to Auxio.
    implementation "androidx.media:media:1.7.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$coroutines_version"
    implementation "com.google.android.gms:play-services-wearable:$wearable_version"
}
