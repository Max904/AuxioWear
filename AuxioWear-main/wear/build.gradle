plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "org.oxycblt.auxio.companion.wear"
    compileSdk target_sdk

    defaultConfig {
        // Must match :phone, the Data Layer only links apps with the same applicationId.
        applicationId "org.oxycblt.auxio.companion"
        minSdk min_sdk_wear
        targetSdk target_sdk
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation project(":protocol")

    implementation platform("androidx.compose:compose-bom:$compose_bom")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    // Icons only. The UI itself is hand-styled, it is not Material.
    implementation "androidx.compose.material:material-icons-extended:1.7.8"

    implementation "androidx.wear.compose:compose-foundation:$wear_compose_version"
    implementation "androidx.wear.compose:compose-navigation:$wear_compose_version"
    implementation "androidx.wear:wear-input:1.1.0"

    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$coroutines_version"
    implementation "com.google.android.gms:play-services-wearable:$wearable_version"
}
