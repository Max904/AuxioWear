// Versions deliberately mirror the main Auxio build (../build.gradle) so one Android Studio
// install can open both.
buildscript {
    ext {
        agp_version = '9.3.2'
        kotlin_version = '2.4.10'
        min_sdk_phone = 24
        min_sdk_wear = 30
        target_sdk = 37

        coroutines_version = '1.9.0'
        wearable_version = '19.0.0'
        compose_bom = '2025.05.01'
        wear_compose_version = '1.4.1'
    }
}

plugins {
    id "com.android.application" version "$agp_version" apply false
    id "com.android.library" version "$agp_version" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "$kotlin_version" apply false
}
